[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sage-forecast-research"
version = "0.1.0"
description = "Selective Agentic Gating with Evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "pandas>=2.2,<4"]
[project.optional-dependencies]
live = ["anthropic>=0.40,<1", "sentence-transformers>=3,<6", "python-dotenv>=1,<2"]
[project.scripts]
sage = "sage.cli:main"
[tool.setuptools.packages.find]
include = ["sage*", "train*", "eval*"]
